services:
  - type: web
    name: forrent-alianzas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /tmp/alianzas_data
      - key: SYNC_KEY
        sync: false
      - key: PYTHON_VERSION
